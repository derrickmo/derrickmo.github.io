# Builds the Vite static site and deploys it to GitHub Pages.
# The site is 100% static (HTML/CSS/JS, React from CDN) — Pages serves the built
# `dist/` directly. In the repo settings, set Pages "Source" to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # PF-0008: dist/ used to be published unconditionally, so a file that never reached
      # the deploy (og-default.png sat at the repo root for months) was invisible until a
      # reader hit it. Every assertion here maps to a bug this repo has actually had.
      #
      # Note this compares the built routes against the COMMITTED sitemap, which is the
      # point: it fails when someone adds a page without regenerating public/sitemap.xml.
      # Do not "fix" a failure by running gen-sitemap.mjs here - it writes to public/, not
      # dist/, so it would not change the comparison, and wiring it to do so would make
      # the check self-fulfilling and stop it catching anything.
      # The 8 cross-reference audits. They are read-only and clone-safe: the three that
      # consult the notebooks repo skip cleanly when DM_NOTEBOOKS_REPO is absent, which
      # is the CI condition (verified by running the suite with it pointed at nothing).
      #
      # Wired in because every class they catch DEPLOYS FINE and looks green. In one
      # session they found 11 pages rendering an empty Connections panel from two
      # CONCEPT_TAGS drifts, and a path validator that could not fail for one of its own
      # kinds. Until now they only ran when a human remembered to.
      - name: Audit cross-references
        run: npm run audit

      - name: Verify build output
        run: node scripts/verify-build-output.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
