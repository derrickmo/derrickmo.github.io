<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpropagation — looping explainer</title>
<!--
  Backpropagation. Pure SVG + CSS, no JS, no external assets.
  9s loop: FORWARD (0-2.3s) -> LOSS (2.3-3.4s) -> BACKWARD (3.6-5.9s)
  -> UPDATE (5.9-6.8s) -> stillness (7.2-9.0s, identical to frame 0 so the
  loop is seamless).
  Sized for the 210px-tall iframe tile in landing-app.jsx "Concepts in motion";
  the viewBox scales to any width. prefers-reduced-motion holds the backward
  frame, the most explanatory one.
-->
<style>
  :root {
    --bg-deep: #050816;
    --blue: #3b82f6; --blue-lt: #60a5fa; --blue-br: #93c5fd;
    --rose: #f43f5e; --rose-lt: #fb7185;
    --emerald-lt: #6ee7b7;
    --white: #e0e7ff; --muted: #94a3b8;
    --grid-soft: rgba(96, 165, 250, 0.045);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --loop: 9s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-deep); color: var(--white);
    display: grid; place-items: center; overflow: hidden;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  svg { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }

  /* ── static base ─────────────────────────────────────────── */
  .ebase { color: rgba(96, 165, 250, 0.16); stroke-width: 1; }
  .ring  { fill: var(--bg-deep); stroke: rgba(96, 165, 250, 0.42); stroke-width: 1.2; }
  .axis  { stroke: rgba(96, 165, 250, 0.18); stroke-width: 1; }
  .cap {
    font-family: var(--mono); font-size: 9px; font-weight: 500;
    letter-spacing: 0.14em; fill: var(--muted); text-anchor: middle;
  }
  .stage {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    letter-spacing: 0.16em; opacity: 0;
  }
  .lbadge { fill: rgba(244, 63, 94, 0.08); stroke: rgba(244, 63, 94, 0.35); stroke-width: 1.2; }
  .lglyph { font-family: var(--mono); font-size: 12px; font-weight: 700; fill: var(--rose-lt); text-anchor: middle; }

  /* ── animated layers ─────────────────────────────────────── */
  .fedge { color: var(--blue-br); stroke-width: 1.6; opacity: 0; filter: drop-shadow(0 0 3px rgba(96,165,250,0.9)); }
  .redge { color: var(--rose-lt); stroke-width: 1.8; opacity: 0; filter: drop-shadow(0 0 3px rgba(244,63,94,0.85)); }
  .uedge { color: var(--emerald-lt); stroke-width: 2.2; opacity: 0; }
  .fdot  { color: #dbeafe; opacity: 0; filter: drop-shadow(0 0 5px var(--blue-lt)); }
  .rdot  { color: #ffe4e6; opacity: 0; filter: drop-shadow(0 0 5px var(--rose)); }
  .lossOn { opacity: 0; }
  .chip  { opacity: 0; }
  .chip rect { fill: rgba(244, 63, 94, 0.14); stroke: var(--rose-lt); stroke-width: 1; }
  .chip text { font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.06em; fill: #ffe4e6; text-anchor: middle; }

  .f0 { animation: f0 var(--loop) linear infinite; }
  .f1 { animation: f1 var(--loop) linear infinite; }
  .f2 { animation: f2 var(--loop) linear infinite; }
  .f3 { animation: f3 var(--loop) linear infinite; }
  .d0 { animation: d0 var(--loop) linear infinite; }
  .d1 { animation: d1 var(--loop) linear infinite; }
  .d2 { animation: d2 var(--loop) linear infinite; }
  .d3 { animation: d3 var(--loop) linear infinite; }
  .r2 { animation: r2 var(--loop) linear infinite; }
  .r1 { animation: r1 var(--loop) linear infinite; }
  .r0 { animation: r0 var(--loop) linear infinite; }
  .q2 { animation: q2 var(--loop) linear infinite; }
  .q1 { animation: q1 var(--loop) linear infinite; }
  .q0 { animation: q0 var(--loop) linear infinite; }
  .lossOn { animation: lossOn var(--loop) linear infinite; }
  .chip { animation: chip var(--loop) cubic-bezier(.4,0,.3,1) infinite; }
  .uedge { animation: upd var(--loop) linear infinite; }
  .s1 { animation: s1 var(--loop) linear infinite; }
  .s2 { animation: s2 var(--loop) linear infinite; }
  .s3 { animation: s3 var(--loop) linear infinite; }
  .s4 { animation: s4 var(--loop) linear infinite; }

  /* forward: signal arrives layer by layer, holds until the loss is read */
  @keyframes f0 { 0%,3% { opacity: 0 } 8%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes f1 { 0%,9% { opacity: 0 } 14%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes f2 { 0%,15% { opacity: 0 } 20%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes f3 { 0%,19% { opacity: 0 } 23%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes d0 { 0%,2% { opacity: 0 } 6%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes d1 { 0%,8% { opacity: 0 } 12%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes d2 { 0%,14% { opacity: 0 } 18%,30% { opacity: 1 } 36%,100% { opacity: 0 } }
  @keyframes d3 { 0%,20% { opacity: 0 } 24%,30% { opacity: 1 } 36%,100% { opacity: 0 } }

  /* loss: flashes, then stays lit as the source of the gradient */
  @keyframes lossOn {
    0%,22% { opacity: 0 } 27% { opacity: 1 } 33% { opacity: 0.7 }
    40% { opacity: 1 } 62% { opacity: 0.85 } 76%,100% { opacity: 0 }
  }

  /* backward: the same edges relight in reverse order, in rose */
  @keyframes r2 { 0%,36% { opacity: 0 } 41%,68% { opacity: 1 } 78%,100% { opacity: 0 } }
  @keyframes r1 { 0%,42% { opacity: 0 } 47%,68% { opacity: 1 } 78%,100% { opacity: 0 } }
  @keyframes r0 { 0%,48% { opacity: 0 } 53%,68% { opacity: 1 } 78%,100% { opacity: 0 } }
  @keyframes q2 { 0%,40% { opacity: 0 } 44%,68% { opacity: 1 } 78%,100% { opacity: 0 } }
  @keyframes q1 { 0%,46% { opacity: 0 } 50%,68% { opacity: 1 } 78%,100% { opacity: 0 } }
  @keyframes q0 { 0%,52% { opacity: 0 } 56%,68% { opacity: 1 } 78%,100% { opacity: 0 } }

  /* the gradient itself, travelling back toward the inputs */
  @keyframes chip {
    0%,37% { opacity: 0; transform: translateX(0) }
    41% { opacity: 1; transform: translateX(-10px) }
    58%,64% { opacity: 1; transform: translateX(-186px) }
    70%,100% { opacity: 0; transform: translateX(-186px) }
  }

  /* update: every weight nudges at once */
  @keyframes upd { 0%,63% { opacity: 0 } 67% { opacity: 0.5 } 74%,100% { opacity: 0 } }

  @keyframes s1 { 0%,2% { opacity: 0 } 6%,22% { opacity: 1 } 26%,100% { opacity: 0 } }
  @keyframes s2 { 0%,26% { opacity: 0 } 30%,36% { opacity: 1 } 40%,100% { opacity: 0 } }
  @keyframes s3 { 0%,40% { opacity: 0 } 44%,60% { opacity: 1 } 64%,100% { opacity: 0 } }
  @keyframes s4 { 0%,64% { opacity: 0 } 68%,76% { opacity: 1 } 80%,100% { opacity: 0 } }

  /* hold the backward frame — the one that carries the idea */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .fedge, .fdot { opacity: 0.28; }
    .redge, .rdot, .lossOn, .chip, .s3 { opacity: 1; }
    .chip { transform: translateX(-186px); }
  }
</style>
</head>
<body>
<div class="bg"></div>

<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="A small neural network runs a forward pass, computes a loss, then the gradient flows backward through the same edges in reverse and every weight updates.">
  <defs>
    <g id="b0" fill="none" stroke="currentColor">
      <line x1="46" y1="56" x2="133" y2="56"/><line x1="46" y1="56" x2="133" y2="100"/><line x1="46" y1="56" x2="133" y2="144"/>
      <line x1="46" y1="100" x2="133" y2="56"/><line x1="46" y1="100" x2="133" y2="100"/><line x1="46" y1="100" x2="133" y2="144"/>
      <line x1="46" y1="144" x2="133" y2="56"/><line x1="46" y1="144" x2="133" y2="100"/><line x1="46" y1="144" x2="133" y2="144"/>
    </g>
    <g id="b1" fill="none" stroke="currentColor">
      <line x1="133" y1="56" x2="220" y2="78"/><line x1="133" y1="56" x2="220" y2="122"/>
      <line x1="133" y1="100" x2="220" y2="78"/><line x1="133" y1="100" x2="220" y2="122"/>
      <line x1="133" y1="144" x2="220" y2="78"/><line x1="133" y1="144" x2="220" y2="122"/>
    </g>
    <g id="b2" fill="none" stroke="currentColor">
      <line x1="220" y1="78" x2="300" y2="100"/><line x1="220" y1="122" x2="300" y2="100"/>
    </g>
    <g id="b3" fill="none" stroke="currentColor">
      <line x1="300" y1="100" x2="342" y2="100"/>
    </g>
    <g id="p0" stroke="none" fill="currentColor">
      <circle cx="46" cy="56" r="4.5"/><circle cx="46" cy="100" r="4.5"/><circle cx="46" cy="144" r="4.5"/>
    </g>
    <g id="p1" stroke="none" fill="currentColor">
      <circle cx="133" cy="56" r="4.5"/><circle cx="133" cy="100" r="4.5"/><circle cx="133" cy="144" r="4.5"/>
    </g>
    <g id="p2" stroke="none" fill="currentColor">
      <circle cx="220" cy="78" r="4.5"/><circle cx="220" cy="122" r="4.5"/>
    </g>
    <g id="p3" stroke="none" fill="currentColor">
      <circle cx="300" cy="100" r="4.5"/>
    </g>
  </defs>

  <!-- resting network -->
  <g class="ebase" fill="none">
    <use href="#b0"/><use href="#b1"/><use href="#b2"/><use href="#b3"/>
  </g>

  <!-- forward pass -->
  <use href="#b0" class="fedge f0"/>
  <use href="#b1" class="fedge f1"/>
  <use href="#b2" class="fedge f2"/>
  <use href="#b3" class="fedge f3"/>

  <!-- backward pass, same edges in reverse -->
  <use href="#b2" class="redge r2"/>
  <use href="#b1" class="redge r1"/>
  <use href="#b0" class="redge r0"/>

  <!-- every weight nudges -->
  <g class="uedge">
    <use href="#b0"/><use href="#b1"/><use href="#b2"/>
  </g>

  <g class="ring" >
    <circle cx="46" cy="56" r="8"/><circle cx="46" cy="100" r="8"/><circle cx="46" cy="144" r="8"/>
    <circle cx="133" cy="56" r="8"/><circle cx="133" cy="100" r="8"/><circle cx="133" cy="144" r="8"/>
    <circle cx="220" cy="78" r="8"/><circle cx="220" cy="122" r="8"/>
    <circle cx="300" cy="100" r="8"/>
  </g>

  <use href="#p0" class="fdot d0"/><use href="#p1" class="fdot d1"/>
  <use href="#p2" class="fdot d2"/><use href="#p3" class="fdot d3"/>
  <use href="#p2" class="rdot q2"/><use href="#p1" class="rdot q1"/><use href="#p0" class="rdot q0"/>

  <!-- loss -->
  <rect class="lbadge" x="344" y="86" width="28" height="28" rx="6"/>
  <g class="lossOn">
    <rect x="344" y="86" width="28" height="28" rx="6" fill="rgba(244,63,94,0.22)"
          stroke="var(--rose-lt)" stroke-width="1.4"/>
    <text class="lglyph" x="358" y="105">L</text>
  </g>

  <!-- the gradient travelling backward -->
  <g class="chip">
    <rect x="268" y="34" width="58" height="18" rx="4"/>
    <text x="297" y="46.5">&#8706;L/&#8706;w</text>
  </g>

  <text class="stage s1" x="14" y="20" fill="var(--blue-br)">FORWARD</text>
  <text class="stage s2" x="14" y="20" fill="var(--rose-lt)">LOSS</text>
  <text class="stage s3" x="14" y="20" fill="var(--rose-lt)">BACKWARD</text>
  <text class="stage s4" x="14" y="20" fill="var(--emerald-lt)">UPDATE</text>

  <line class="axis" x1="28" y1="166" x2="372" y2="166"/>
  <text class="cap" x="46" y="182">INPUT</text>
  <text class="cap" x="133" y="182">H1</text>
  <text class="cap" x="220" y="182">H2</text>
  <text class="cap" x="300" y="182">&#374;</text>
  <text class="cap" x="358" y="182">LOSS</text>
</svg>
</body>
</html>
