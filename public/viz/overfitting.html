<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overfitting — looping explainer</title>
<!--
  Overfitting. Pure SVG + CSS, no JS, no external assets.

  The nine points are a saturating truth g(x) = 128 - 72*(1 - e^(-(x-38)/42))
  plus alternating noise of about +/-7. That shape matters: it leaves real
  curvature for a straight line to miss, so all three labels are honest.

    UNDERFIT  least-squares line, y = 79 - 0.4407*(x-110).
              Residual signs + - - - - - + - +  : a run of five negatives,
              the signature of missed structure.  RMS 12.4
    GOOD FIT  tracks g(x). Residual signs + - + - + - + - + : pure alternation,
              nothing systematic left on the table.  RMS 6.5
    OVERFIT   threads all nine points exactly and swings between them.  RMS 0

  Right panel: training error falls the whole way; held-out error falls, bottoms
  out, then turns upward. The sweep line ties the panels together - when it
  crosses the held-out minimum, the left curve is the good fit.

  9s loop: fade in, 5.7s of motion, 1.8s of stillness holding the overfit state,
  fade out, invisible reset so frame 100% equals frame 0.
  Both error paths carry pathLength="100" so the draw-on is exact.
  Sized for the 210px-tall iframe tile in landing-app.jsx "Concepts in motion".
-->
<style>
  :root {
    --bg-deep: #050816;
    --blue: #3b82f6; --blue-lt: #60a5fa; --blue-br: #93c5fd;
    --rose: #f43f5e; --rose-lt: #fb7185;
    --emerald: #10b981; --emerald-lt: #6ee7b7;
    --white: #e0e7ff; --muted: #94a3b8;
    --grid-soft: rgba(96, 165, 250, 0.045);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --loop: 9s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg-deep); color: var(--white);
    display: grid; place-items: center; overflow: hidden;
  }
  .bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
    background-size: 20px 20px;
  }
  svg { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }

  .pt { fill: var(--blue-br); }
  .divider { stroke: rgba(96, 165, 250, 0.16); stroke-width: 1; }
  .axis { stroke: rgba(96, 165, 250, 0.18); stroke-width: 1; }
  .cap {
    font-family: var(--mono); font-size: 9px; font-weight: 500;
    letter-spacing: 0.14em; fill: var(--muted); text-anchor: middle;
  }
  .tag { font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: 0.1em; }
  .stage { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; opacity: 0; }

  .run { opacity: 0; animation: run var(--loop) linear infinite; }

  .curve { fill: none; stroke-width: 1.8; opacity: 0; }
  .c-smooth { stroke: var(--muted); animation: cSmooth var(--loop) linear infinite; }
  .c-fit    { stroke: var(--emerald-lt); animation: cFit var(--loop) linear infinite; }
  .c-over   { stroke: var(--rose-lt); stroke-linejoin: round; stroke-linecap: round;
              animation: cOver var(--loop) linear infinite; }

  .eline { fill: none; stroke-width: 1.8; stroke-dasharray: 100; stroke-dashoffset: 100; }
  .e-train { stroke: var(--blue-lt); animation: draw var(--loop) linear infinite; }
  .e-val   { stroke: var(--rose-lt); animation: draw var(--loop) linear infinite; }

  .sweep { stroke: rgba(224, 231, 255, 0.35); stroke-width: 1; opacity: 0;
           animation: sweep var(--loop) linear infinite; }
  .best { opacity: 0; animation: best var(--loop) linear infinite; }
  .best line { stroke: var(--emerald-lt); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.7; }
  .best circle { fill: var(--emerald-lt); }
  .best text { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.1em; fill: var(--emerald-lt); text-anchor: end; }

  .s-under { animation: sUnder var(--loop) linear infinite; }
  .s-fit   { animation: sFit var(--loop) linear infinite; }
  .s-over  { animation: sOver var(--loop) linear infinite; }

  @keyframes run { 0%,3% { opacity: 0 } 6%,88% { opacity: 1 } 95%,100% { opacity: 0 } }
  @keyframes draw { 0%,5% { stroke-dashoffset: 100 } 68%,100% { stroke-dashoffset: 0 } }
  @keyframes sweep {
    0%,5%   { opacity: 0.35; transform: translateX(0) }
    68%     { opacity: 0.35; transform: translateX(140px) }
    88%     { opacity: 0.2; transform: translateX(140px) }
    100%    { opacity: 0; transform: translateX(140px) }
  }
  @keyframes cSmooth { 0%,5% { opacity: 0 } 8%,24% { opacity: 1 } 30%,100% { opacity: 0 } }
  @keyframes cFit    { 0%,24% { opacity: 0 } 30%,46% { opacity: 1 } 54%,100% { opacity: 0 } }
  @keyframes cOver   { 0%,46% { opacity: 0 } 54%,100% { opacity: 1 } }
  @keyframes best    { 0%,40% { opacity: 0 } 46%,100% { opacity: 1 } }
  @keyframes sUnder  { 0%,6% { opacity: 0 } 9%,24% { opacity: 1 } 28%,100% { opacity: 0 } }
  @keyframes sFit    { 0%,28% { opacity: 0 } 32%,46% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes sOver   { 0%,50% { opacity: 0 } 54%,100% { opacity: 1 } }

  /* hold the frame that carries the idea: the overfit curve through every point,
     held-out error already turned upward, and the early-stopping point marked */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .run { opacity: 1; }
    .c-smooth, .c-fit, .s-under, .s-fit, .sweep { opacity: 0; }
    .c-over, .s-over, .best { opacity: 1; }
    .eline { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="bg"></div>

<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="On the left, nine noisy points follow a curve that rises steeply then flattens. A straight line misses that bend, a smooth curve captures it, and a spiky curve passes through every point. On the right, training error keeps falling while held-out error falls, reaches a minimum, then turns upward.">

  <g class="pt">
    <circle cx="38" cy="134" r="3"/><circle cx="56" cy="96" r="3"/><circle cx="74" cy="94" r="3"/>
    <circle cx="92" cy="70" r="3"/><circle cx="110" cy="76" r="3"/><circle cx="128" cy="57" r="3"/>
    <circle cx="146" cy="67" r="3"/><circle cx="164" cy="53" r="3"/><circle cx="182" cy="64" r="3"/>
  </g>

  <g class="run">
    <path class="curve c-smooth" d="M34 112.5 L186 45.5"/>
    <path class="curve c-fit" d="M34 135 C 46 112, 60 90, 92 76 C 116 66, 140 61, 186 58"/>
    <path class="curve c-over" d="M38 134 L47 124 L56 96 L65 86 L74 94 L83 92 L92 70 L101 63 L110 76 L119 77 L128 57 L137 50 L146 67 L155 72 L164 53 L173 46 L182 64"/>

    <text class="stage s-under" x="30" y="32" fill="var(--muted)">UNDERFIT</text>
    <text class="stage s-fit" x="30" y="32" fill="var(--emerald-lt)">GOOD FIT</text>
    <text class="stage s-over" x="30" y="32" fill="var(--rose-lt)">OVERFIT</text>

    <path class="eline e-train" pathLength="100" d="M232 74 C 262 104, 302 128, 372 143"/>
    <path class="eline e-val" pathLength="100" d="M232 70 C 258 94, 284 114, 302 117 C 324 121, 346 96, 372 64"/>

    <text class="tag" x="368" y="154" text-anchor="end" fill="var(--blue-lt)">TRAIN</text>
    <text class="tag" x="368" y="56" text-anchor="end" fill="var(--rose-lt)">HELD-OUT</text>

    <g class="best">
      <line x1="302" y1="50" x2="302" y2="145"/>
      <circle cx="302" cy="117" r="3.5"/>
      <text x="297" y="46">BEST</text>
    </g>

    <line class="sweep" x1="232" y1="46" x2="232" y2="146"/>
  </g>

  <line class="divider" x1="210" y1="44" x2="210" y2="150"/>

  <line class="axis" x1="28" y1="166" x2="372" y2="166"/>
  <text class="cap" x="110" y="182">DATA + FIT</text>
  <text class="cap" x="302" y="182">COMPLEXITY</text>
</svg>
</body>
</html>
